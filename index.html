<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stupid IA</title>
<style>
body{margin:0;font-family:system-ui;background:#111;color:#eee}
header{padding:20px;text-align:center;background:#222}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:20px}
.card{background:#1b1b1b;padding:15px;border-radius:12px;transition:.2s;cursor:pointer}
.card:hover{transform:scale(1.03)}
#out{padding:20px;min-height:80px}
textarea{width:100%;height:80px}
button{padding:8px 14px}
.fade{animation:f .3s}@keyframes f{from{opacity:0}to{opacity:1}}
</style>
</head><body>
<header><h1>Stupid IA</h1><div>Archivio disponibile per 5 minuti.</div><div id="timer"></div></header>
<div class="grid" id="cats"></div>
<div id="out" class="fade">Clicca una categoria.</div>
<section style="padding:20px">
<h2>Commenti</h2>
<textarea id="c"></textarea><br><button onclick="save()">Salva</button>
<ul id="list"></ul>
</section>
<script>
const categories=[
"Animali","Scuola","Lavoro","Robot","Pizza","Spazio","Computer","Meme","Sport","Vacanze",
"Film","Musica","Gatti","Cani","Programmazione","Caffè","Fantasmi","Ninja","Pirati","Zombie"
];
const replies=[
"Ho calcolato il risultato: è colpa della gravità.",
"Errore 404: cervello temporaneamente in pausa.",
"La risposta è sì, ma solo il martedì.",
"Secondo i miei algoritmi... boh.",
"Ho consultato un tostapane: approva.",
"Probabilità di successo: banana.",
"Questa domanda merita un applauso lento.",
"Sto ridendo in codice binario.",
"Missione completata con stile discutibile.",
"È scientificamente quasi forse."
];
const cats=document.getElementById('cats'),out=document.getElementById('out');
categories.forEach(c=>{
 let d=document.createElement('div');d.className='card';d.textContent=c;
 d.onclick=()=>{out.className='fade';out.innerHTML='<h3>'+c+'</h3><p>'+replies[Math.floor(Math.random()*replies.length)]+'</p>';};
 cats.appendChild(d);
});
let end=+localStorage.end||(Date.now()+300000);localStorage.end=end;
setInterval(()=>{let s=Math.max(0,Math.floor((end-Date.now())/1000));timer.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(!s)out.textContent="Archivio scaduto.";},1000);
function render(){let a=JSON.parse(localStorage.comments||"[]");list.innerHTML=a.map(x=>"<li>"+x+"</li>").join("")}
function save(){let a=JSON.parse(localStorage.comments||"[]");a.push(c.value);localStorage.comments=JSON.stringify(a);c.value="";render();}
render();
</script>
</body></html>
