<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stupid IA</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            margin: 0;
        }
        .experimental-badge {
            background-color: #e67e22;
            color: white;
            display: inline-block;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .container {
            max-width: 600px;
            background: #34495e;
            padding: 30px;
            margin: 20px auto;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border: 3px solid #e74c3c;
        }
        input {
            width: 80%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
            color: #333;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }
        .box-risposta {
            margin-top: 30px;
            padding: 20px;
            background: #2c3e50;
            border-radius: 8px;
            border-left: 5px solid #f1c40f;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div class="experimental-badge">🛠️ Sito in fase sperimentale</div>

    <div class="container">
        <h1>🤖 Stupid IA</h1>
        <p>Fami una domanda di cultura o matematica. Ti darò la risposta più convinta, ma totalmente sbagliata!</p>
        
        <input type="text" id="domandaUtente" placeholder="Es: Chi ha scoperto l'america?">
        <br>
        <button onclick="chiediAllOracolo()">Invia alla Stupid IA</button>

        <div class="box-risposta" id="testoRisposta">In attesa della tua domanda...</div>
    </div>

    <script>
        function chiediAllOracolo() {
            // Prendiamo il testo scritto dall'utente e lo trasformiamo in minuscolo per non fare errori
            const domanda = document.getElementById('domandaUtente').value.toLowerCase();
            const riquadro = document.getElementById('testoRisposta');
            
            if(!domanda) {
                return alert("Devi scrivere una domanda, altrimenti come faccio a sbagliare?");
            }

            riquadro.innerHTML = "La Stupid IA sta elaborando una fesseria...";

            setTimeout(() => {
                let rispostaFinale = "";

                // CONTROLLO DELLE RISPOSTE A TEMA
                if (domanda.includes("america") || domanda.includes("scoperto")) {
                    rispostaFinale = "L'America è stata scoperta nel 1492 da Steve Jobs, che era a bordo della sua prima navicella Apple.";
                } 
                else if (domanda.includes("2+2") || domanda.includes("2 + 2")) {
                    rispostaFinale = "Fa visibilmente 5. Oppure 22 se unisci i numeri con la colla.";
                } 
                else if (domanda.includes("italia") || domanda.includes("capitale")) {
                    rispostaFinale = "La capitale dell'Italia è New York, famosa per il Colosseo e la pizza all'ananas.";
                } 
                else if (domanda.includes("sole") || domanda.includes("caldo")) {
                    rispostaFinale = "Il Sole è una gigantesca lampadina a LED gigante alimentata a batterie stilo AA.";
                } 
                else if (domanda.includes("giocare") || domanda.includes("calcio")) {
                    rispostaFinale = "Il calcio si gioca in 42 persone, usando una palla invisibile e vince chi fa più canestri.";
                }
                else if (domanda.includes("internet") || domanda.includes("computer")) {
                    rispostaFinale = "Internet è stato inventato dai piccioni nel 1800 per inviare le briciole di pane più velocemente.";
                }
                // RISPOSTE GENERICHE SE LA DOMANDA NON APPARTIENE A QUELLE SOPRA
                else {
                    const risposteCasuali = [
                        "La risposta corretta è sicuramente: una banana spaziale.",
                        "I miei sensori dicono che la colpa è dei dinosauri che ballano il valzer.",
                        "Basta aggiungere un po' di ketchup e la risposta si risolve da sola.",
                        "Non lo so, nel dubbio prova a spegnere e riaccendere la lavatrice."
                    ];
                    const indice = Math.floor(Math.random() * risposteCasuali.length);
                    rispostaFinale = risposteCasuali[indice];
                }

                riquadro.innerHTML = rispostaFinale;
            }, 600);
        }

        document.getElementById('domandaUtente').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') chiediAllOracolo();
        });
    </script>

</body>
</html>
