<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stupid IA</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            margin: 0;
        }
        .experimental-badge {
            background-color: #e67e22;
            color: white;
            display: inline-block;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .container {
            max-width: 600px;
            background: #34495e;
            padding: 30px;
            margin: 20px auto;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border: 3px solid #e74c3c;
        }
        input {
            width: 80%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
            color: #333;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }
        .box-risposta {
            margin-top: 30px;
            padding: 20px;
            background: #2c3e50;
            border-radius: 8px;
            border-left: 5px solid #f1c40f;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div class="experimental-badge">🛠️ Sito in fase sperimentale</div>

    <div class="container">
        <h1>🤖 Stupid IA</h1>
        <p>Chiedimi qualsiasi cosa (es. "Perché il cielo è blu?" o "Quanto fa 2+2?") ed io ti darò la risposta meno azzeccata del pianeta.</p>
        
        <input type="text" id="domandaUtente" placeholder="Fai la tua domanda qui...">
        <br>
        <button onclick="chiediAllOracolo()">Invia alla Stupid IA</button>

        <div class="box-risposta" id="testoRisposta">In attesa della tua domanda...</div>
    </div>

    <script>
        // Database di risposte completamente sballate e casuali
        const risposteAssurde = [
            "La risposta corretta è chiaramente: una banana spaziale.",
            "Secondo i miei calcoli scientifici, la colpa è dei dinosauri che ballano il valzer.",
            "Fa esattamente 47, ma solo se piove di martedì.",
            "Perché la gravità è stata inventata dai produttori di colla.",
            "Basta aggiungere un po' di ketchup e il problema si risolve da solo.",
            "La risposta si trova scritta dietro l'orecchio di un gatto invisibile.",
            "Dipende da quanti pixel ha il tuo frigorifero.",
            "Non lo so, ma nel dubbio ti consiglio di spegnere e riaccendere la lavatrice.",
            "È scientificamente dimostrato che accade perché la Luna è fatta di parmigiano.",
            "42! Ah no, scusa, ho sbagliato film.",
            "La risposta corretta è volata via insieme a un piccione viaggiatore.",
            "Se ci pensi bene, la risposta è dentro di te (ma è comunque sbagliata)."
        ];

        function chiediAllOracolo() {
            const domanda = document.getElementById('domandaUtente').value;
            const riquadro = document.getElementById('testoRisposta');
            
            if(!domanda) {
                return alert("Devi scrivere una domanda, altrimenti come faccio a sbagliare?");
            }

            riquadro.innerHTML = "La Stupid IA sta elaborando una sciocchezza...";

            // Sceglie una risposta a caso dal database dopo un piccolo ritardo comico
            setTimeout(() => {
                const indiceCasuale = Math.floor(Math.random() * risposteAssurde.length);
                riquadro.innerHTML = risposteAssurde[indiceCasuale];
            }, 600);
        }

        // Permette di premere "Invio" sulla tastiera per fare la domanda
        document.getElementById('domandaUtente').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') chiediAllOracolo();
        });
    </script>

</body>
</html>
